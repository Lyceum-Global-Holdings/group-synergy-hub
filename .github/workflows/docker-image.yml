name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        path: .
        
    - name: Build the Docker image
      working-directory: ${{ github.workspace }}
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)