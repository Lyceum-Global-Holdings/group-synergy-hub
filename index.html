<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Enterprise Procurement Management System | ERP Dashboard</title>
    <meta name="description" content="Comprehensive enterprise resource planning system for centralized procurement management across multiple companies. Finance, warehouse, sourcing, and procurement modules with role-based access control." />
    <meta name="keywords" content="ERP, procurement management, enterprise system, finance, warehouse, sourcing, multi-company" />
    <meta name="author" content="Enterprise Management Solutions" />
    <!-- Drift check: presence of this tag confirms the published bundle includes the /b/:id QR route. -->
    <meta name="lovable-route-version" content="b-qr-v1" />

    <!-- Preconnect hints for faster resource loading (Stage 1: Network shell) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- Supabase API + Realtime: the first auth + telemetry round-trips happen
         before any user interaction, so paying DNS/TLS up front saves ~200–400 ms TTFB. -->
    <link rel="preconnect" href="https://ajsyvuozkgcnnvvefeed.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ajsyvuozkgcnnvvefeed.supabase.co" />

    <!-- Critical shell CSS: paints a neutral background + spinner within ~1 s
         so users see progress while React + vendor chunks parse. Matches the
         design-system background token (hsl(210 40% 98%)). -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: hsl(210 40% 98%);
        color: hsl(222 47% 11%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        margin: auto;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid hsl(217 91% 60% / 0.25);
        border-top-color: hsl(217 91% 60%);
        animation: lgh-spin 0.8s linear infinite;
      }
      @keyframes lgh-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::before { animation: none; }
      }
    </style>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ERP System" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="Enterprise Procurement Management System | ERP Dashboard" />

    <meta name="twitter:title" content="Enterprise Procurement Management System" />
    <meta name="twitter:description" content="Streamline your procurement operations with our comprehensive ERP system" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  </body>
</html>
